<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>School World</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #080d19;
    color: #f1f5f9;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 235px;
    background: #101827;
    border-right: 1px solid #26334d;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 5px;
}

.world-name {
    font-size: 12px;
    color: #94a3b8;
    min-height: 32px;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.nav button,
.reset-button {
    border: none;
    border-radius: 10px;
    padding: 12px;
    background: #19243a;
    color: #e2e8f0;
    cursor: pointer;
    text-align: left;
}

.nav button:hover,
.nav button.active {
    background: #293957;
}

.reset-button {
    margin-top: auto;
    background: #632337;
}

.reset-button:hover {
    background: #7c2943;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    min-width: 0;
}

.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    padding: 17px 20px;
    border-bottom: 1px solid #26334d;
    background: #0d1525;
}

.header h1 {
    margin: 0;
    font-size: 20px;
}

.header p {
    margin: 5px 0 0;
    color: #94a3b8;
    font-size: 13px;
}

/* MESSAGES */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.message {
    max-width: 820px;
    padding: 14px 16px;
    border-radius: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
}

.message.user {
    align-self: flex-end;
    background: #34486f;
}

.message.ai {
    align-self: flex-start;
    background: #172239;
}

.message.system {
    align-self: center;
    background: #172033;
    color: #a5b4fc;
    font-size: 13px;
}

/* COMPOSER */

.composer {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #26334d;
}

.composer input {
    flex: 1;
    border: 1px solid #35445f;
    background: #111a2b;
    color: white;
    padding: 13px;
    border-radius: 11px;
    outline: none;
}

.composer input:focus {
    border-color: #7184e8;
}

.composer button {
    border: none;
    border-radius: 11px;
    padding: 0 21px;
    background: #6578e8;
    color: white;
    cursor: pointer;
}

/* SIDE PANEL */

.side-panel {
    width: 390px;
    background: #0e1626;
    border-left: 1px solid #26334d;
    overflow-y: auto;
    padding: 18px;
    display: none;
}

.side-panel.open {
    display: block;
}

.side-panel h2 {
    margin-top: 0;
}

.choice {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border: 1px solid #374764;
    border-radius: 10px;
    background: #172239;
    color: white;
    text-align: left;
    cursor: pointer;
}

.choice:hover {
    background: #253452;
}

.small {
    font-size: 12px;
    color: #94a3b8;
}

.story-card {
    padding: 13px;
    border: 1px solid #33435f;
    border-radius: 11px;
    margin-bottom: 10px;
    background: #111a2c;
}

.story-card.seen {
    border-color: #64748b;
}

.story-card.unseen {
    opacity: 0.42;
}

.story-card.current {
    border-color: #8b9cf5;
    box-shadow: 0 0 0 1px #8b9cf5 inset;
}

.ending {
    color: #fbbf24;
}

.loading {
    color: #94a3b8;
}

hr {
    border: none;
    border-top: 1px solid #293750;
    margin: 18px 0;
}

/* MOBILE */

@media(max-width: 850px) {

    .sidebar {
        width: 70px;
        padding: 10px;
    }

    .logo,
    .world-name,
    .nav span {
        display: none;
    }

    .nav button,
    .reset-button {
        text-align: center;
    }

    .side-panel {
        width: 330px;
    }
}

</style>

</head>

<body>

<div class="app">

    <!-- SIDE MENU -->

    <aside class="sidebar">

        <div class="logo">
            🌎 School World
        </div>

        <div id="worldName"
             class="world-name">
            Loading world...
        </div>

        <div class="nav">

            <button id="chatButton"
                    class="active"
                    onclick="showChat()">
                🤖 <span>AI Chat</span>
            </button>

            <button onclick="showStory()">
                📖 <span>Story Mode</span>
            </button>

            <button onclick="showTree()">
                🌳 <span>Story Tree</span>
            </button>

            <button onclick="showReplay()">
                🔁 <span>Replay Worlds</span>
            </button>

        </div>

        <button class="reset-button"
                onclick="resetWorld()">
            🌎 <span>Reset World</span>
        </button>

    </aside>


    <!-- MAIN AREA -->

    <main class="main">

        <section class="chat">

            <header class="header">

                <h1>
                    AI Conversation
                </h1>

                <p id="status">
                    Your characters are aware of the world.
                </p>

            </header>


            <div id="messages"
                 class="messages">
            </div>


            <form id="chatForm"
                  class="composer">

                <input
                    id="messageInput"
                    autocomplete="off"
                    placeholder="Talk to the AI..."
                >

                <button type="submit">
                    Send
                </button>

            </form>

        </section>


        <!-- STORY SIDE PANEL -->

        <aside id="sidePanel"
               class="side-panel">
        </aside>

    </main>

</div>


<script>

let world = null;

let savedWorlds =
    JSON.parse(
        localStorage.getItem("schoolWorldSaves") || "[]"
    );


/* --------------------------------------------------
   HELPERS
-------------------------------------------------- */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function addMessage(type, text) {

    const element =
        document.createElement("div");

    element.className =
        "message " + type;

    element.textContent =
        text;

    const messages =
        document.getElementById("messages");

    messages.appendChild(element);

    messages.scrollTop =
        messages.scrollHeight;
}


function saveWorld() {

    if (!world) {
        return;
    }

    const copy =
        JSON.parse(
            JSON.stringify(world)
        );

    const index =
        savedWorlds.findIndex(
            w => w.id === copy.id
        );

    if (index >= 0) {

        savedWorlds[index] =
            copy;

    } else {

        savedWorlds.unshift(
            copy
        );
    }

    // Keep the most recent 15 worlds.
    savedWorlds =
        savedWorlds.slice(0, 15);

    localStorage.setItem(
        "schoolWorldSaves",
        JSON.stringify(savedWorlds)
    );
}


/* --------------------------------------------------
   LOAD WORLD
-------------------------------------------------- */

async function loadWorld() {

    try {

        const response =
            await fetch("/api/world");

        world =
            await response.json();

        document.getElementById(
            "worldName"
        ).textContent =
            world.title;

        document.getElementById(
            "messages"
        ).innerHTML = "";

        addMessage(
            "system",
            "🌎 " +
            world.title +
            "\n\n" +
            "The world is ready. You can talk to the AI normally or open Story Mode."
        );

        saveWorld();

    } catch (error) {

        addMessage(
            "system",
            "Could not load the world: " +
            error.message
        );
    }
}


/* --------------------------------------------------
   CHAT
-------------------------------------------------- */

document
    .getElementById("chatForm")
    .addEventListener(
        "submit",
        sendChat
    );


async function sendChat(event) {

    event.preventDefault();

    const input =
        document.getElementById(
            "messageInput"
        );

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    input.value = "";

    addMessage(
        "user",
        message
    );

    document.getElementById(
        "status"
    ).textContent =
        "AI is thinking...";

    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            message: message
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Chat failed."
            );
        }

        world =
            data.world;

        addMessage(
            "ai",
            data.reply
        );

        saveWorld();

    } catch (error) {

        addMessage(
            "system",
            "AI error: " +
            error.message
        );

    } finally {

        document.getElementById(
            "status"
        ).textContent =
            "Your characters are aware of the world.";
    }
}


/* --------------------------------------------------
   PANELS
-------------------------------------------------- */

function openPanel() {

    document
        .getElementById("sidePanel")
        .classList.add("open");
}


function closePanel() {

    document
        .getElementById("sidePanel")
        .classList.remove("open");
}


function showChat() {

    closePanel();

    document
        .getElementById("chatButton")
        .classList.add("active");
}


function showStory() {

    openPanel();

    startStory();
}


/* --------------------------------------------------
   STORY
-------------------------------------------------- */

async function startStory() {

    const panel =
        document.getElementById(
            "sidePanel"
        );

    panel.innerHTML = `
        <h2>📖 Story Mode</h2>
        <p class="loading">
            Loading story...
        </p>
    `;

    try {

        if (!world.started) {

            const response =
                await fetch(
                    "/story/start",
                    {
                        method: "POST"
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Story failed."
                );
            }

            world =
                data.world;

            addMessage(
                "ai",
                data.reply
            );

            saveWorld();
        }

        renderStory();

    } catch (error) {

        panel.innerHTML = `
            <h2>Story Error</h2>
            <p>
                ${escapeHtml(error.message)}
            </p>
        `;
    }
}


function renderStory() {

    const panel =
        document.getElementById(
            "sidePanel"
        );

    const node =
        world.nodes[
            world.current
        ];

    let html = "";

    html += `
        <h2>
            📖 ${escapeHtml(world.title)}
        </h2>
    `;

    html += `
        <p>
            ${escapeHtml(node.text)}
        </p>
    `;


    if (world.ended) {

        html += `
            <p class="ending">
                <strong>
                    ENDING:
                    ${escapeHtml(world.ending)}
                </strong>
            </p>
        `;

        html += `
            <p class="small">
                This world is complete.
                You can replay it or reset the world
                to create a completely different story.
            </p>
        `;

    } else {

        html += `
            <h3>
                What do you do?
            </h3>
        `;

        node.choices.forEach(
            choice => {

                html += `
                    <button
                        class="choice"
                        onclick="chooseStory('${choice.id}')">

                        ${escapeHtml(
                            choice.text
                        )}

                    </button>
                `;
            }
        );
    }

    html += `
        <hr>

        <p class="small">
            Story progress:
            ${world.visited.length}
            nodes discovered
        </p>
    `;

    panel.innerHTML =
        html;
}


async function chooseStory(choiceId) {

    const panel =
        document.getElementById(
            "sidePanel"
        );

    panel.innerHTML = `
        <h2>📖 Story Mode</h2>

        <p class="loading">
            Your decision is changing the story...
        </p>
    `;

    try {

        const response =
            await fetch(
                "/story/choose",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            choice_id:
                                choiceId
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Choice failed."
            );
        }

        world =
            data.world;

        addMessage(
            "ai",
            data.reply
        );

        saveWorld();

        renderStory();

    } catch (error) {

        panel.innerHTML = `
            <h2>Story Error</h2>

            <p>
                ${escapeHtml(
                    error.message
                )}
            </p>
        `;
    }
}


/* --------------------------------------------------
   STORY TREE
-------------------------------------------------- */

async function showTree() {

    openPanel();

    const panel =
        document.getElementById(
            "sidePanel"
        );

    panel.innerHTML = `
        <h2>🌳 Story Tree</h2>

        <p class="loading">
            Loading the complete story tree...
        </p>
    `;

    try {

        const response =
            await fetch(
                "/story/tree"
            );

        const data =
            await response.json();

        let html = `
            <h2>
                🌳 Story Tree
            </h2>

            <p class="small">
                ${escapeHtml(
                    data.title
                )}
            </p>
        `;

        html += `
            <div>
        `;

        data.nodes.forEach(
            node => {

                let className =
                    "story-card ";

                if (node.current) {

                    className +=
                        "current";

                } else if (node.seen) {

                    className +=
                        "seen";

                } else {

                    className +=
                        "unseen";
                }

                html += `
                    <div class="${className}">

                        <strong>
                            ${escapeHtml(
                                node.title
                            )}
                        </strong>

                        <p class="small">
                            ${
                                node.seen
                                ? "✓ Seen"
                                : "○ Not discovered"
                            }
                        </p>
                `;

                if (node.ending) {

                    html += `
                        <p class="ending">
                            Ending:
                            ${escapeHtml(
                                node.ending
                            )}
                        </p>
                    `;
                }

                html += `
                        <p class="small">
                            ${escapeHtml(
                                node.text
                            )}
                        </p>

                    </div>
                `;
            }
        );

        html += `
            </div>
        `;

        panel.innerHTML =
            html;

    } catch (error) {

        panel.innerHTML = `
            <h2>Tree Error</h2>
            <p>
                ${escapeHtml(
                    error.message
                )}
            </p>
        `;
    }
}


/* --------------------------------------------------
   REPLAY WORLDS
-------------------------------------------------- */

function showReplay() {

    openPanel();

    const panel =
        document.getElementById(
            "sidePanel"
        );

    let html = `
        <h2>
            🔁 Replay Worlds
        </h2>
    `;

    if (!savedWorlds.length) {

        html += `
            <p class="small">
                You haven't created any saved worlds yet.
            </p>
        `;

    } else {

        savedWorlds.forEach(
            saved => {

                html += `
                    <div class="story-card">

                        <strong>
                            ${escapeHtml(
                                saved.title
                            )}
                        </strong>

                        <p class="small">
                            ${
                                saved.ended
                                ? "Completed"
                                : "In progress"
                            }

                            ·

                            ${
                                saved.visited
                                ? saved.visited.length
                                : 0
                            }

                            nodes discovered
                        </p>

                        <button
                            class="choice"
                            onclick="replayWorld('${saved.id}')">

                            Replay World

                        </button>

                    </div>
                `;
            }
        );
    }

    panel.innerHTML =
        html;
}


async function replayWorld(id) {

    const saved =
        savedWorlds.find(
            world =>
                world.id === id
        );

    if (!saved) {
        return;
    }

    try {

        const response =
            await fetch(
                "/world/replay",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            world: saved
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Replay failed."
            );
        }

        world =
            data;

        document.getElementById(
            "worldName"
        ).textContent =
            world.title;

        document.getElementById(
            "messages"
        ).innerHTML = "";

        addMessage(
            "system",
            "🔁 Replaying " +
            world.title
        );

        renderStory();

    } catch (error) {

        // The server might have restarted.
        // The browser copy can still be loaded.

        world =
            JSON.parse(
                JSON.stringify(saved)
            );

        document.getElementById(
            "worldName"
        ).textContent =
            world.title;

        document.getElementById(
            "messages"
        ).innerHTML = "";

        addMessage(
            "system",
            "🔁 Loaded saved world: " +
            world.title
        );

        renderStory();
    }
}


/* --------------------------------------------------
   RESET
-------------------------------------------------- */

async function resetWorld() {

    const confirmed =
        confirm(
            "Reset the world?\n\n" +
            "This will create a new story tree, " +
            "new characters/order, new locations, " +
            "and a new storyline.\n\n" +
            "Your old world will remain available " +
            "under Replay Worlds."
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                "/world/reset",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Reset failed."
            );
        }

        world =
            data;

        document.getElementById(
            "worldName"
        ).textContent =
            world.title;

        document.getElementById(
            "messages"
        ).innerHTML = "";

        addMessage(
            "system",
            "🌎 NEW WORLD CREATED\n\n" +
            world.title +
            "\n\n" +
            "The old world is still available in Replay Worlds."
        );

        saveWorld();

        showChat();

    } catch (error) {

        addMessage(
            "system",
            "Reset error: " +
            error.message
        );
    }
}


/* --------------------------------------------------
   START
-------------------------------------------------- */

loadWorld();

</script>

</body>

</html>
