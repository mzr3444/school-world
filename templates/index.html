<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School World</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #090d16;
    color: #ffffff;
}

header {
    padding: 18px 25px;
    background: #111827;
    border-bottom: 1px solid #293548;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-weight: bold;
}

button:hover {
    opacity: .85;
}

.danger {
    background: #dc2626;
}

.secondary {
    background: #374151;
}

.layout {
    display: grid;
    grid-template-columns: 230px 1fr 300px;
    height: calc(100vh - 65px);
}

.sidebar,
.rightbar {
    background: #0f1522;
    padding: 18px;
    overflow-y: auto;
}

.sidebar {
    border-right: 1px solid #293548;
}

.rightbar {
    border-left: 1px solid #293548;
}

.main {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.world-title {
    padding: 15px 20px;
    background: #111827;
    border-bottom: 1px solid #293548;
}

.world-title h2 {
    margin: 0 0 5px;
}

.location {
    color: #9ca3af;
}

.story {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    margin-bottom: 22px;
    max-width: 850px;
}

.story-text {
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 16px;
}

.user-action {
    background: #172033;
    border-left: 4px solid #2563eb;
    padding: 14px;
    border-radius: 7px;
    margin-bottom: 20px;
}

.ai-story {
    background: #101827;
    border-left: 4px solid #8b5cf6;
    padding: 18px;
    border-radius: 7px;
}

.composer {
    border-top: 1px solid #293548;
    padding: 15px;
    background: #0f1522;
}

textarea {
    width: 100%;
    min-height: 75px;
    resize: vertical;
    background: #080c14;
    color: white;
    border: 1px solid #344158;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
}

.controls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.choice {
    width: 100%;
    text-align: left;
    margin-bottom: 8px;
    background: #1e293b;
}

.choice:hover {
    background: #334155;
}

.panel-title {
    margin-top: 0;
    font-size: 16px;
}

.node {
    padding: 9px;
    margin-bottom: 7px;
    border-radius: 6px;
    background: #182235;
    font-size: 13px;
}

.node.visited {
    border-left: 3px solid #22c55e;
}

.node.current {
    border-left: 3px solid #3b82f6;
}

.node.unseen {
    opacity: .45;
}

.small {
    color: #9ca3af;
    font-size: 12px;
}

.ending {
    padding: 14px;
    border-radius: 8px;
    background: #312e81;
    margin-bottom: 15px;
}

.status {
    margin-top: 10px;
    color: #fbbf24;
}

@media(max-width: 1000px) {
    .layout {
        grid-template-columns: 180px 1fr;
    }

    .rightbar {
        display: none;
    }
}

@media(max-width: 700px) {
    .layout {
        display: block;
        height: auto;
    }

    .sidebar {
        display: none;
    }

    .main {
        min-height: calc(100vh - 65px);
    }
}
</style>
</head>

<body>

<header>
    <h1>🌎 School World</h1>

    <div>
        <button onclick="newWorld()">New World</button>
        <button class="danger" onclick="resetWorld()">Reset World</button>
    </div>
</header>

<div class="layout">

    <aside class="sidebar">

        <h3>World</h3>

        <div class="small">World ID</div>
        <div id="worldId">None</div>

        <br>

        <div class="small">Turn</div>
        <div id="turn">0</div>

        <br>

        <div class="small">Location</div>
        <div id="sideLocation">Classroom</div>

        <br>

        <button class="secondary" onclick="replayWorld()">
            Replay World
        </button>

        <br><br>

        <button class="secondary" onclick="showTree()">
            Refresh Story Tree
        </button>

    </aside>


    <main class="main">

        <div class="world-title">

            <h2 id="worldName">
                No world loaded
            </h2>

            <div class="location">
                📍 <span id="location">Classroom</span>
            </div>

        </div>


        <section class="story" id="story">

            <div class="message">

                <div class="ai-story">

                    <div class="story-text">
                        Create a new world to begin your story.
                    </div>

                </div>

            </div>

        </section>


        <section class="composer">

            <textarea
                id="input"
                placeholder="What do you do?"
                onkeydown="handleKey(event)"
            ></textarea>

            <div class="controls">

                <button onclick="sendMessage()">
                    Send
                </button>

                <button
                    class="secondary"
                    onclick="clearInput()"
                >
                    Clear
                </button>

            </div>

            <div
                class="status"
                id="status"
            ></div>

        </section>

    </main>


    <aside class="rightbar">

        <h3 class="panel-title">
            🌳 Story Tree
        </h3>

        <div class="small">
            Green = visited
        </div>

        <div class="small">
            Blue = current
        </div>

        <div class="small">
            Faded = unseen
        </div>

        <br>

        <div id="tree">
            No story yet.
        </div>

        <hr>

        <h3 class="panel-title">
            🎭 Characters
        </h3>

        <div id="characters">
            No characters yet.
        </div>

        <hr>

        <h3 class="panel-title">
            🧠 Memories
        </h3>

        <div id="memories">
            No memories yet.
        </div>

        <hr>

        <div id="ending"></div>

    </aside>

</div>


<script>

let world = null;


// ============================================================
// NEW WORLD
// ============================================================

async function newWorld() {

    setStatus("Creating a new world...");

    try {

        const response = await fetch("/world/new", {
            method: "POST"
        });

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "Could not create world.");
        }

        world = data.world;

        renderWorld();

        document.getElementById("story").innerHTML = `
            <div class="message">
                <div class="ai-story">
                    <div class="story-text">
                        A new world has been created.<br><br>
                        The choices you make here will shape what happens next.
                        Your story has begun...
                    </div>
                </div>
            </div>
        `;

        setStatus("World created.");

    } catch(error) {

        setStatus(error.message);

    }

}


// ============================================================
// RESET
// ============================================================

async function resetWorld() {

    if (!world) {

        await newWorld();
        return;

    }

    const confirmed = confirm(
        "Reset this world? All memories and story progress will be erased."
    );

    if (!confirmed) {
        return;
    }

    setStatus("Resetting world...");

    try {

        const response = await fetch(
            `/world/${world.id}/reset`,
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "Reset failed.");
        }

        world = data.world;

        document.getElementById("story").innerHTML = "";

        renderWorld();

        setStatus("World reset. A completely new story can begin.");

    } catch(error) {

        setStatus(error.message);

    }

}


// ============================================================
// REPLAY
// ============================================================

async function replayWorld() {

    if (!world) {
        setStatus("Create a world first.");
        return;
    }

    setStatus("Creating replay...");

    try {

        const response = await fetch(
            `/world/${world.id}/replay`,
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "Replay failed.");
        }

        world = data.world;

        document.getElementById("story").innerHTML = `
            <div class="message">
                <div class="ai-story">
                    <div class="story-text">
                        Replay started.<br><br>
                        This is a fresh run. Your previous choices do not
                        control this version of the world.
                    </div>
                </div>
            </div>
        `;

        renderWorld();

        setStatus("Replay started.");

    } catch(error) {

        setStatus(error.message);

    }

}


// ============================================================
// SEND MESSAGE
// ============================================================

async function sendMessage() {

    if (!world) {

        setStatus("Create a world first.");

        return;

    }

    if (world.finished) {

        setStatus("This story has already ended. Replay or create a new world.");

        return;

    }

    const input = document.getElementById("input");

    const message = input.value.trim();

    if (!message) {
        return;
    }

    addUserMessage(message);

    input.value = "";

    setStatus("The world is reacting...");

    try {

        const response = await fetch(
            "/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    world_id: world.id,
                    message: message
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "AI request failed.");
        }

        world = data.world;

        addAIStory(
            data.story,
            data.choices
        );

        renderWorld();

        if (data.ending) {

            showEnding(data.ending);

        }

        setStatus("");

    } catch(error) {

        setStatus("AI Error: " + error.message);

    }

}


// ============================================================
// USER MESSAGE
// ============================================================

function addUserMessage(text) {

    const story = document.getElementById("story");

    const element = document.createElement("div");

    element.className = "message";

    element.innerHTML = `
        <div class="user-action">
            <strong>You</strong>
            <div class="story-text">
                ${escapeHTML(text)}
            </div>
        </div>
    `;

    story.appendChild(element);

    story.scrollTop = story.scrollHeight;

}


// ============================================================
// AI STORY
// ============================================================

function addAIStory(text, choices) {

    const story = document.getElementById("story");

    const element = document.createElement("div");

    element.className = "message";

    let choicesHTML = "";

    if (choices && choices.length) {

        choicesHTML = `
            <div style="margin-top:20px;">
                <strong>What will you do?</strong>
                <br><br>

                ${choices.map(choice => `
                    <button
                        class="choice"
                        onclick="choose(${JSON.stringify(choice)})"
                    >
                        ${escapeHTML(choice)}
                    </button>
                `).join("")}

            </div>
        `;

    }

    element.innerHTML = `
        <div class="ai-story">

            <div class="story-text">
                ${escapeHTML(text)}
            </div>

            ${choicesHTML}

        </div>
    `;

    story.appendChild(element);

    story.scrollTop = story.scrollHeight;

}


// ============================================================
// CHOICE
// ============================================================

function choose(choice) {

    document.getElementById("input").value = choice;

    sendMessage();

}


// ============================================================
// STORY TREE
// ============================================================

async function showTree() {

    if (!world) {
        return;
    }

    try {

        const response = await fetch(
            `/world/${world.id}/tree`
        );

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "Tree unavailable.");
        }

        renderTree(
            data.tree,
            data.current_node
        );

    } catch(error) {

        setStatus(error.message);

    }

}


function renderTree(tree, currentNode) {

    const container = document.getElementById("tree");

    container.innerHTML = "";

    const nodes = Object.entries(tree);

    if (!nodes.length) {

        container.innerHTML =
            `<div class="small">No story nodes yet.</div>`;

        return;

    }

    nodes.forEach(([id, node]) => {

        const element = document.createElement("div");

        let className = "node";

        if (node.status === "visited") {
            className += " visited";
        }

        if (id === currentNode) {
            className += " current";
        }

        element.className = className;

        element.innerHTML = `
            <strong>${escapeHTML(node.title)}</strong>

            <div class="small">
                Turn ${node.turn || 0}
            </div>

            <div class="small">
                ${escapeHTML(node.location || "")}
            </div>
        `;

        container.appendChild(element);

    });

}


// ============================================================
// RENDER WORLD
// ============================================================

function renderWorld() {

    if (!world) {
        return;
    }

    document.getElementById("worldId").textContent =
        world.id;

    document.getElementById("worldName").textContent =
        world.name;

    document.getElementById("turn").textContent =
        world.turn;

    document.getElementById("location").textContent =
        world.location;

    document.getElementById("sideLocation").textContent =
        world.location;


    // Characters

    const characters =
        document.getElementById("characters");

    characters.innerHTML = "";

    Object.entries(world.characters || {})
        .forEach(([key, value]) => {

            const div =
                document.createElement("div");

            div.className = "node";

            div.innerHTML =
                `<strong>${escapeHTML(key)}</strong>
                 <br>${escapeHTML(value)}`;

            characters.appendChild(div);

        });


    // Memories

    const memories =
        document.getElementById("memories");

    memories.innerHTML = "";

    const recentMemories =
        (world.memories || []).slice(-10);

    if (!recentMemories.length) {

        memories.innerHTML =
            `<div class="small">No memories yet.</div>`;

    } else {

        recentMemories.forEach(memory => {

            const div =
                document.createElement("div");

            div.className = "node";

            div.textContent = memory;

            memories.appendChild(div);

        });

    }


    renderTree(
        world.story_nodes || {},
        world.current_node
    );


    if (world.ending) {
        showEnding(world.ending);
    }

}


// ============================================================
// ENDING
// ============================================================

function showEnding(ending) {

    const container =
        document.getElementById("ending");

    container.innerHTML = `
        <div class="ending">

            <strong>🏁 Story Ending</strong>

            <br><br>

            ${escapeHTML(ending)}

            <br><br>

            <button
                onclick="replayWorld()"
                class="secondary"
            >
                Replay
            </button>

        </div>
    `;

}


// ============================================================
// UTILITIES
// ============================================================

function clearInput() {

    document.getElementById("input").value = "";

}


function setStatus(text) {

    document.getElementById("status").textContent =
        text;

}


function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        String(text ?? "");

    return div.innerHTML;

}


// ============================================================
// START
// ============================================================

window.addEventListener("load", () => {

    newWorld();

});

</script>

</body>
</html>
