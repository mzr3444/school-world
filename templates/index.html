<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School World</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b12;
    color: #e9eef7;
    font-family: Arial, Helvetica, sans-serif;
}

button {
    cursor: pointer;
    border: 0;
}

header {
    height: 64px;
    background: #0d111b;
    border-bottom: 1px solid #222a3a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    position: sticky;
    top: 0;
    z-index: 50;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.header-buttons button {
    background: #182132;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
}

.header-buttons button:hover {
    background: #243149;
}

.layout {
    display: grid;
    grid-template-columns: 270px 1fr 360px;
    min-height: calc(100vh - 64px);
}

/* LEFT */

.sidebar {
    background: #0b0f17;
    border-right: 1px solid #222a3a;
    padding: 18px;
    overflow-y: auto;
}

.sidebar h2 {
    margin-top: 0;
    font-size: 17px;
}

.world-button {
    width: 100%;
    text-align: left;
    background: #131a28;
    color: white;
    padding: 13px;
    border-radius: 9px;
    margin-bottom: 9px;
    border: 1px solid #202b3e;
}

.world-button:hover {
    background: #1b2536;
}

.world-button.active {
    border-color: #718cff;
}

.world-small {
    display: block;
    color: #8d9ab1;
    font-size: 11px;
    margin-top: 5px;
}

/* CENTER */

.story-area {
    padding: 25px;
    overflow-y: auto;
}

.world-title {
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 5px;
}

.theme {
    color: #8896ad;
    margin-bottom: 20px;
}

.scene-card {
    background: #101621;
    border: 1px solid #222c3e;
    border-radius: 14px;
    padding: 25px;
    max-width: 950px;
    margin: auto;
}

.scene-title {
    font-size: 25px;
    margin-bottom: 5px;
}

.scene-location {
    color: #8290aa;
    margin-bottom: 22px;
}

.scene-text {
    white-space: pre-wrap;
    line-height: 1.75;
    font-size: 16px;
}

.choices {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.choice {
    background: #182237;
    color: white;
    padding: 15px 18px;
    border-radius: 9px;
    text-align: left;
    border: 1px solid #273550;
    font-size: 15px;
}

.choice:hover {
    background: #243352;
    border-color: #718cff;
}

.ending {
    margin-top: 25px;
    padding: 20px;
    border: 1px solid #5d78d8;
    border-radius: 12px;
    background: #141c31;
}

.loading {
    text-align: center;
    color: #8896ad;
    padding: 50px;
}

/* RIGHT TREE */

.tree-panel {
    background: #0b0f17;
    border-left: 1px solid #222a3a;
    padding: 18px;
    overflow-y: auto;
}

.tree-panel h2 {
    margin-top: 0;
}

.tree-description {
    color: #8491a7;
    font-size: 13px;
    line-height: 1.5;
}

.tree {
    margin-top: 20px;
}

.chapter {
    color: #7584a0;
    font-size: 11px;
    font-weight: bold;
    margin: 18px 0 7px;
    text-transform: uppercase;
}

.node {
    position: relative;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 9px;
    border: 1px solid #202a3c;
    background: #111722;
}

.node.seen {
    border-color: #38506e;
    background: #131d2b;
}

.node.current {
    border-color: #728dff;
    box-shadow: 0 0 0 1px #728dff;
}

.node.unseen {
    opacity: 0.62;
}

.node.ending {
    background: #171727;
}

.node-title {
    font-size: 13px;
    font-weight: bold;
}

.node-location {
    font-size: 10px;
    color: #78869e;
    margin-top: 4px;
}

.node-status {
    font-size: 10px;
    margin-top: 8px;
}

.seen-status {
    color: #75d99a;
}

.unseen-status {
    color: #77839a;
}

.current-status {
    color: #8ca3ff;
}

.legend {
    margin-top: 18px;
    padding: 12px;
    border-radius: 9px;
    background: #101620;
    font-size: 11px;
    color: #8996aa;
    line-height: 1.8;
}

/* MODALS */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal.open {
    display: flex;
}

.modal-box {
    width: min(850px, 92vw);
    max-height: 85vh;
    overflow-y: auto;
    background: #101621;
    border: 1px solid #29354b;
    border-radius: 14px;
    padding: 24px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.close {
    background: #222c3d;
    color: white;
    padding: 8px 12px;
    border-radius: 7px;
}

.world-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    background: #151d2b;
    border: 1px solid #253149;
    padding: 15px;
    margin-top: 10px;
    border-radius: 10px;
}

.world-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.world-actions button {
    padding: 8px 11px;
    border-radius: 7px;
    background: #253149;
    color: white;
}

.world-actions button:hover {
    background: #344463;
}

.delete-button {
    background: #5c252d !important;
}

@media (max-width: 1100px) {
    .layout {
        grid-template-columns: 220px 1fr;
    }

    .tree-panel {
        display: none;
    }
}

@media (max-width: 700px) {
    .layout {
        display: block;
    }

    .sidebar {
        display: none;
    }

    .story-area {
        padding: 12px;
    }

    .scene-card {
        padding: 17px;
    }
}

</style>
</head>

<body>

<header>

    <div class="logo">
        🌎 School World
    </div>

    <div class="header-buttons">
        <button onclick="newWorld()">🌎 New World</button>
        <button onclick="openWorlds()">📚 Worlds</button>
        <button onclick="restartWorld()">🔄 Restart</button>
    </div>

</header>


<div class="layout">

    <aside class="sidebar">

        <h2>Characters</h2>

        <div id="characters">
            No world loaded.
        </div>

    </aside>


    <main class="story-area">

        <div id="story">
            <div class="loading">
                Create a new world to begin.
            </div>
        </div>

    </main>


    <aside class="tree-panel">

        <h2>🌳 Story Tree</h2>

        <div class="tree-description">
            The complete structure of this world is shown here.
            Green nodes have been seen. Dim nodes have not been
            reached yet.
        </div>

        <div id="tree" class="tree">
            No world loaded.
        </div>

        <div class="legend">
            🟢 Seen<br>
            🔵 Current scene<br>
            ⚪ Not seen yet<br>
            🏁 Ending
        </div>

    </aside>

</div>


<!-- WORLDS MODAL -->

<div id="worldModal" class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>📚 Your Worlds</h2>

            <button
                class="close"
                onclick="closeWorlds()">
                Close
            </button>

        </div>

        <div id="worldList">
            Loading...
        </div>

    </div>

</div>


<script>

let currentWorld = null;


/* ============================================================
   API
   ============================================================ */

async function api(url, options = {}) {

    const response = await fetch(url, {
        headers: {
            "Content-Type": "application/json"
        },
        ...options
    });

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.error || "Server error");
    }

    return data;
}


/* ============================================================
   NEW WORLD
   ============================================================ */

async function newWorld() {

    if (currentWorld) {

        const okay = confirm(
            "Create a completely new world?\n\n" +
            "Your current world will remain saved in Replay Worlds."
        );

        if (!okay) return;
    }

    showLoading("Creating a completely new world...");

    try {

        const world = await api("/world/new", {
            method: "POST"
        });

        currentWorld = world;

        renderWorld();

    } catch (error) {

        showError(error);

    }
}


/* ============================================================
   LOAD WORLD
   ============================================================ */

async function loadWorld(id) {

    closeWorlds();

    showLoading("Loading world...");

    try {

        const world = await api(
            "/world/" + encodeURIComponent(id)
        );

        currentWorld = world;

        renderWorld();

    } catch (error) {

        showError(error);

    }
}


/* ============================================================
   CHOOSE
   ============================================================ */

async function choose(index) {

    if (!currentWorld) return;

    const scene = currentWorld.current_scene;

    if (!scene.choices[index]) return;

    disableChoices();

    showLoading("The world is reacting to your decision...");

    try {

        const world = await api(
            "/world/" +
            encodeURIComponent(currentWorld.id) +
            "/choose",
            {
                method: "POST",
                body: JSON.stringify({
                    choice_index: index
                })
            }
        );

        currentWorld = world;

        renderWorld();

    } catch (error) {

        showError(error);

    }
}


/* ============================================================
   RESTART
   ============================================================ */

async function restartWorld() {

    if (!currentWorld) {

        alert("No world is currently loaded.");

        return;
    }

    const okay = confirm(
        "Restart this exact world?\n\n" +
        "The story tree, characters and seed will stay the same, " +
        "but your progress will be reset."
    );

    if (!okay) return;

    showLoading("Restarting world...");

    try {

        const world = await api(
            "/world/" +
            encodeURIComponent(currentWorld.id) +
            "/restart",
            {
                method: "POST"
            }
        );

        currentWorld = world;

        renderWorld();

    } catch (error) {

        showError(error);

    }
}


/* ============================================================
   WORLDS
   ============================================================ */

async function openWorlds() {

    document
        .getElementById("worldModal")
        .classList
        .add("open");

    const container =
        document.getElementById("worldList");

    container.innerHTML = "Loading worlds...";

    try {

        const data = await api("/worlds");

        if (!data.worlds.length) {

            container.innerHTML =
                "<p>No saved worlds yet.</p>";

            return;
        }

        container.innerHTML = "";

        for (const world of data.worlds) {

            const row =
                document.createElement("div");

            row.className = "world-row";

            const ending =
                world.completed
                ? "Ending: " + world.ending
                : "In progress";

            row.innerHTML = `
                <div>
                    <strong>${escapeHtml(world.title)}</strong>
                    <div class="world-small">
                        Chapter ${world.chapter}
                        • ${escapeHtml(ending)}
                    </div>
                    <div class="world-small">
                        Seed: ${world.seed}
                    </div>
                </div>

                <div class="world-actions">

                    <button
                        onclick="loadWorld('${world.id}')">
                        ▶ Continue
                    </button>

                    <button
                        onclick="restartSpecific('${world.id}')">
                        🔄 Restart
                    </button>

                    <button
                        class="delete-button"
                        onclick="deleteWorld('${world.id}')">
                        🗑 Delete
                    </button>

                </div>
            `;

            container.appendChild(row);
        }

    } catch (error) {

        container.innerHTML =
            "<p>" +
            escapeHtml(error.message) +
            "</p>";

    }
}


function closeWorlds() {

    document
        .getElementById("worldModal")
        .classList
        .remove("open");
}


async function restartSpecific(id) {

    const okay = confirm(
        "Restart this world from the beginning?"
    );

    if (!okay) return;

    try {

        const world = await api(
            "/world/" +
            encodeURIComponent(id) +
            "/restart",
            {
                method: "POST"
            }
        );

        currentWorld = world;

        closeWorlds();

        renderWorld();

    } catch (error) {

        alert(error.message);

    }
}


async function deleteWorld(id) {

    const okay = confirm(
        "Permanently delete this world?"
    );

    if (!okay) return;

    try {

        await api(
            "/world/" +
            encodeURIComponent(id),
            {
                method: "DELETE"
            }
        );

        if (
            currentWorld &&
            currentWorld.id === id
        ) {
            currentWorld = null;

            document.getElementById("story").innerHTML =
                `<div class="loading">
                    World deleted.
                </div>`;

            document.getElementById("tree").innerHTML =
                "No world loaded.";

            document.getElementById("characters").innerHTML =
                "No world loaded.";
        }

        openWorlds();

    } catch (error) {

        alert(error.message);

    }
}


/* ============================================================
   RENDER WORLD
   ============================================================ */

function renderWorld() {

    renderStory();

    renderCharacters();

    renderTree();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ============================================================
   STORY
   ============================================================ */

function renderStory() {

    const story =
        document.getElementById("story");

    const scene =
        currentWorld.current_scene;

    let html = `

        <div class="world-title">
            ${escapeHtml(currentWorld.title)}
        </div>

        <div class="theme">
            Theme: ${escapeHtml(currentWorld.theme)}
            • Seed: ${currentWorld.seed}
        </div>

        <div class="scene-card">

            <div class="scene-title">
                ${escapeHtml(scene.title)}
            </div>

            <div class="scene-location">
                Chapter ${scene.chapter}
                • 📍 ${escapeHtml(scene.location)}
            </div>

            <div class="scene-text">
                ${escapeHtml(scene.description)}
            </div>
    `;

    if (currentWorld.completed) {

        html += `

            <div class="ending">

                <strong>
                    🏁 ${escapeHtml(currentWorld.ending)}
                </strong>

                <p>
                    This world has reached one of its
                    possible major endings.
                </p>

                <button
                    class="choice"
                    onclick="restartWorld()">
                    🔄 Restart This World
                </button>

                <button
                    class="choice"
                    onclick="newWorld()">
                    🌎 Create A Completely New World
                </button>

            </div>
        `;

    } else {

        html += `
            <div class="choices">
        `;

        scene.choices.forEach((choice, index) => {

            html += `
                <button
                    class="choice"
                    onclick="choose(${index})">

                    ${index + 1}. 
                    ${escapeHtml(choice.text)}

                </button>
            `;

        });

        html += `
            </div>
        `;
    }

    html += `
        </div>
    `;

    story.innerHTML = html;
}


/* ============================================================
   CHARACTERS
   ============================================================ */

function renderCharacters() {

    const container =
        document.getElementById("characters");

    if (!currentWorld) {

        container.innerHTML =
            "No world loaded.";

        return;
    }

    container.innerHTML = "";

    Object.values(
        currentWorld.characters
    ).forEach(character => {

        const div =
            document.createElement("div");

        div.style.background = "#131a28";
        div.style.padding = "11px";
        div.style.borderRadius = "8px";
        div.style.marginBottom = "8px";

        const relationship =
            character.relationship >= 3
            ? "Close"
            : character.relationship > 0
            ? "Friendly"
            : character.relationship < 0
            ? "Distrustful"
            : "Neutral";

        div.innerHTML = `
            <strong>
                ${escapeHtml(character.name)}
            </strong>

            <div class="world-small">
                ${escapeHtml(character.trait)}
            </div>

            <div class="world-small">
                Relationship: ${relationship}
            </div>

            <div class="world-small">
                Trust: ${character.trust}
            </div>
        `;

        container.appendChild(div);
    });
}


/* ============================================================
   STORY TREE
   ============================================================ */

function renderTree() {

    const treeContainer =
        document.getElementById("tree");

    if (!currentWorld) {

        treeContainer.innerHTML =
            "No world loaded.";

        return;
    }

    treeContainer.innerHTML = "";

    let currentChapter = null;

    currentWorld.tree.forEach(node => {

        if (node.chapter !== currentChapter) {

            currentChapter = node.chapter;

            const chapter =
                document.createElement("div");

            chapter.className = "chapter";

            chapter.textContent =
                "Chapter " + currentChapter;

            treeContainer.appendChild(chapter);
        }

        const div =
            document.createElement("div");

        div.className = "node";

        if (node.seen) {
            div.classList.add("seen");
        } else {
            div.classList.add("unseen");
        }

        if (
            node.id ===
            currentWorld.current_node
        ) {
            div.classList.add("current");
        }

        if (node.type === "ending") {
            div.classList.add("ending");
        }

        let status;

        if (
            node.id ===
            currentWorld.current_node
        ) {

            status =
                `<div class="node-status current-status">
                    🔵 CURRENT
                </div>`;

        } else if (node.seen) {

            status =
                `<div class="node-status seen-status">
                    🟢 SEEN
                </div>`;

        } else {

            status =
                `<div class="node-status unseen-status">
                    ⚪ NOT SEEN YET
                </div>`;
        }

        const ending =
            node.type === "ending"
            ? " 🏁"
            : "";

        div.innerHTML = `

            <div class="node-title">
                ${ending}
                ${escapeHtml(node.title)}
            </div>

            <div class="node-location">
                📍 ${escapeHtml(node.location)}
            </div>

            ${status}

        `;

        treeContainer.appendChild(div);
    });
}


/* ============================================================
   UI HELPERS
   ============================================================ */

function showLoading(text) {

    document.getElementById("story").innerHTML =
        `<div class="loading">
            ${escapeHtml(text)}
        </div>`;
}


function showError(error) {

    document.getElementById("story").innerHTML =
        `<div class="scene-card">
            <h2>Something went wrong</h2>

            <div class="scene-text">
                ${escapeHtml(error.message)}
            </div>

            <br>

            <button
                class="choice"
                onclick="location.reload()">
                Reload
            </button>
        </div>`;
}


function disableChoices() {

    document
        .querySelectorAll(".choice")
        .forEach(button => {
            button.disabled = true;
            button.style.opacity = "0.5";
        });
}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ============================================================
   STARTUP
   ============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        // The app starts with no selected world.
        // User can choose New World or Replay Worlds.

    }
);

</script>

</body>
</html>
