<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School World</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #10131a;
    color: #f2f4f8;
    height: 100vh;
    overflow: hidden;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    display: grid;
    grid-template-columns: 250px 1fr;
    height: 100vh;
}

/* ================= SIDEBAR ================= */

.sidebar {
    background: #171b24;
    border-right: 1px solid #303746;
    padding: 18px;
    overflow-y: auto;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 20px;
}

.section-title {
    color: #8993a7;
    font-size: 12px;
    text-transform: uppercase;
    margin: 20px 0 8px;
}

.menu-button,
.character-button {
    width: 100%;
    border: 0;
    background: transparent;
    color: #dce1ea;
    padding: 11px;
    border-radius: 9px;
    text-align: left;
    margin-bottom: 5px;
}

.menu-button:hover,
.character-button:hover {
    background: #252b38;
}

.character-button.active {
    background: #30394b;
}

.world-info {
    background: #11151d;
    border: 1px solid #303746;
    border-radius: 10px;
    padding: 12px;
    margin-top: 18px;
    font-size: 13px;
    color: #aeb7c7;
}

.danger {
    color: #ff8181;
}

/* ================= MAIN ================= */

.main {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 64px;
    border-bottom: 1px solid #303746;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: #151922;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.top-actions {
    display: flex;
    gap: 8px;
}

.small-button {
    background: #252c3a;
    color: white;
    border: 1px solid #3b4456;
    padding: 8px 12px;
    border-radius: 8px;
}

.small-button:hover {
    background: #31394a;
}

.content {
    display: flex;
    flex: 1;
    min-height: 0;
}

/* ================= CHAT ================= */

.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
}

.message {
    max-width: 780px;
    margin: 0 auto 16px;
    display: flex;
}

.message-inner {
    padding: 14px 16px;
    border-radius: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
}

.message.user {
    justify-content: flex-end;
}

.message.user .message-inner {
    background: #34445d;
    max-width: 70%;
}

.message.ai {
    justify-content: flex-start;
}

.message.ai .message-inner {
    background: #1d232e;
    border: 1px solid #303746;
    max-width: 80%;
}

.empty {
    text-align: center;
    color: #7f899b;
    margin-top: 100px;
}

/* ================= INPUT ================= */

.input-area {
    padding: 15px;
    border-top: 1px solid #303746;
    background: #151922;
}

.input-box {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 10px;
}

#messageInput {
    flex: 1;
    background: #0f131a;
    color: white;
    border: 1px solid #3a4353;
    border-radius: 11px;
    padding: 13px;
    outline: none;
}

#messageInput:focus {
    border-color: #66748c;
}

.send {
    background: #435777;
    color: white;
    border: 0;
    border-radius: 11px;
    padding: 0 20px;
}

.send:hover {
    background: #526b92;
}

/* ================= STORY PANEL ================= */

.story-panel {
    width: 390px;
    border-left: 1px solid #303746;
    background: #131720;
    display: none;
    flex-direction: column;
    min-width: 0;
}

.story-panel.visible {
    display: flex;
}

.story-header {
    padding: 16px;
    border-bottom: 1px solid #303746;
}

.story-title {
    font-size: 18px;
    font-weight: bold;
}

.story-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
}

.story-scene {
    background: #1b212c;
    border: 1px solid #303746;
    padding: 15px;
    border-radius: 11px;
    line-height: 1.5;
    margin-bottom: 15px;
}

.choice {
    width: 100%;
    text-align: left;
    background: #222a38;
    border: 1px solid #3a4558;
    color: white;
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 9px;
}

.choice:hover {
    background: #303b4f;
}

.choice-label {
    font-weight: bold;
    margin-right: 8px;
}

.ending {
    background: #292318;
    border: 1px solid #80652e;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
}

/* ================= TREE ================= */

.tree {
    margin-top: 20px;
}

.tree-node {
    border-left: 2px solid #384354;
    padding-left: 12px;
    margin: 8px 0;
}

.tree-node.seen {
    border-color: #6f91bd;
}

.tree-node.ending {
    border-color: #c8a15a;
}

.tree-label {
    font-size: 12px;
    color: #9ba6b8;
}

.tree-hidden {
    color: #626d7f;
}

.tree-seen {
    color: #9dbbe5;
}

/* ================= PANELS ================= */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.overlay.visible {
    display: flex;
}

.modal {
    width: min(700px, 90vw);
    max-height: 85vh;
    overflow-y: auto;
    background: #181e28;
    border: 1px solid #3b4557;
    border-radius: 14px;
    padding: 20px;
}

.modal h2 {
    margin-top: 0;
}

.modal-button {
    width: 100%;
    background: #252d3b;
    color: white;
    border: 1px solid #3b4659;
    border-radius: 9px;
    padding: 11px;
    margin-top: 8px;
}

.modal-button:hover {
    background: #323d50;
}

.improvement {
    padding: 11px;
    background: #202632;
    border-radius: 9px;
    margin: 7px 0;
}

.interaction {
    background: #1c222d;
    border: 1px solid #303746;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
}

.status {
    font-size: 12px;
    color: #7f8a9d;
    margin-top: 6px;
}

@media (max-width: 900px) {
    .app {
        grid-template-columns: 190px 1fr;
    }

    .story-panel {
        width: 320px;
    }
}

@media (max-width: 700px) {
    body {
        overflow: auto;
    }

    .app {
        display: block;
        height: auto;
        min-height: 100vh;
    }

    .sidebar {
        height: auto;
    }

    .content {
        min-height: 700px;
    }

    .story-panel {
        position: fixed;
        inset: 0;
        width: 100%;
        z-index: 5;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            🏫 School World
        </div>

        <div class="section-title">
            Menu
        </div>

        <button class="menu-button" onclick="toggleStory()">
            📖 Story Mode
        </button>

        <button class="menu-button" onclick="showTree()">
            🌳 Story Tree
        </button>

        <button class="menu-button" onclick="showInteractions()">
            👥 NPC Interactions
        </button>

        <button class="menu-button" onclick="showImprovements()">
            🧠 Improvement
        </button>

        <div class="section-title">
            Characters
        </div>

        <div id="characterList"></div>

        <div class="section-title">
            World
        </div>

        <button class="menu-button" onclick="newWorld()">
            ✨ New World
        </button>

        <button class="menu-button" onclick="resetWorld()">
            🔄 Reset World
        </button>

        <button class="menu-button" onclick="showPreviousWorlds()">
            📚 Replay Worlds
        </button>

        <div class="world-info" id="worldInfo">
            Loading world...
        </div>

    </aside>

    <!-- ================= MAIN ================= -->

    <main class="main">

        <header class="topbar">

            <div>
                <div class="title" id="chatTitle">
                    Select a character
                </div>

                <div class="status" id="status">
                    Connecting...
                </div>
            </div>

            <div class="top-actions">

                <button
                    class="small-button"
                    onclick="newText()">
                    New Text
                </button>

                <button
                    class="small-button"
                    onclick="resetConversation()">
                    Reset Conversation
                </button>

            </div>

        </header>

        <div class="content">

            <!-- CHAT -->

            <section class="chat-area">

                <div
                    class="messages"
                    id="messages">

                    <div class="empty">
                        Choose someone from the school to start talking.
                    </div>

                </div>

                <div class="input-area">

                    <div class="input-box">

                        <input
                            id="messageInput"
                            type="text"
                            placeholder="Talk to someone..."
                            autocomplete="off"
                        >

                        <button
                            class="send"
                            onclick="sendMessage()">
                            Send
                        </button>

                    </div>

                </div>

            </section>

            <!-- STORY -->

            <aside
                class="story-panel"
                id="storyPanel">

                <div class="story-header">

                    <div
                        class="story-title"
                        id="storyTitle">
                        Story Mode
                    </div>

                    <div class="status">
                        Every decision affects what comes next.
                    </div>

                </div>

                <div
                    class="story-content"
                    id="storyContent">
                </div>

            </aside>

        </div>

    </main>

</div>


<!-- ================= MODAL ================= -->

<div
    class="overlay"
    id="overlay"
    onclick="closeModal(event)">

    <div
        class="modal"
        id="modal"
        onclick="event.stopPropagation()">

        <div id="modalContent"></div>

    </div>

</div>


<script>
let selectedCharacter = null;
let story = null;
let storyTree = null;
let idleTimer = null;

const characterList =
    document.getElementById("characterList");

const messages =
    document.getElementById("messages");

const input =
    document.getElementById("messageInput");

const statusText =
    document.getElementById("status");

const storyPanel =
    document.getElementById("storyPanel");

const storyContent =
    document.getElementById("storyContent");


// ============================================================
// INITIALIZATION
// ============================================================

async function initialize() {

    try {

        const response =
            await fetch("/api/status");

        const data =
            await response.json();

        renderCharacters(data.characters);

        renderWorld(data.world);

        story = data.story;
        storyTree = story.tree;

        statusText.textContent =
            data.ai_configured
                ? "AI connected"
                : "AI key missing";

        if (data.ai_configured) {
            statusText.textContent =
                "AI connected • " + data.model;
        }

        renderStory();

    } catch (error) {

        statusText.textContent =
            "Connection error";

        console.error(error);
    }
}


// ============================================================
// CHARACTERS
// ============================================================

function renderCharacters(characters) {

    characterList.innerHTML = "";

    Object.entries(characters).forEach(
        ([id, character]) => {

            const button =
                document.createElement("button");

            button.className =
                "character-button";

            button.textContent =
                `${character.name} • ${character.location}`;

            button.onclick =
                () => selectCharacter(id);

            button.dataset.character = id;

            characterList.appendChild(button);
        }
    );
}


function selectCharacter(id) {

    selectedCharacter = id;

    const buttons =
        document.querySelectorAll(
            ".character-button"
        );

    buttons.forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.character === id
        );

    });

    const button =
        document.querySelector(
            `[data-character="${id}"]`
        );

    const name =
        button
            ? button.textContent.split(" • ")[0]
            : id;

    document.getElementById(
        "chatTitle"
    ).textContent = `Talking to ${name}`;

    loadConversation();

    input.focus();
}


// ============================================================
// CONVERSATION
// ============================================================

async function loadConversation() {

    if (!selectedCharacter) {
        return;
    }

    messages.innerHTML = "";

    // There isn't a separate GET route for conversations,
    // so the page starts visually clean.
    // The backend still keeps memories.
    addMessage(
        "ai",
        "Conversation loaded. I remember important things from this world."
    );
}


function addMessage(type, text) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        `message ${type}`;

    const inner =
        document.createElement("div");

    inner.className =
        "message-inner";

    inner.textContent = text;

    wrapper.appendChild(inner);

    messages.appendChild(wrapper);

    messages.scrollTop =
        messages.scrollHeight;
}


async function sendMessage() {

    if (!selectedCharacter) {

        alert(
            "Choose a character first."
        );

        return;
    }

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    addMessage("user", text);

    input.value = "";

    input.disabled = true;

    statusText.textContent =
        "Thinking...";

    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    character:
                        selectedCharacter,

                    message:
                        text
                })
            });

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Chat request failed."
            );
        }

        addMessage(
            "ai",
            data.reply
        );

        statusText.textContent =
            "AI connected";

    } catch (error) {

        addMessage(
            "ai",
            "I couldn't connect right now: " +
            error.message
        );

        statusText.textContent =
            "Chat error";

    } finally {

        input.disabled = false;

        input.focus();

        restartIdleTimer();
    }
}


input.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);


// ============================================================
// NEW TEXT
// ============================================================

function newText() {

    messages.innerHTML = "";

    addMessage(
        "ai",
        "New text started. Your world memories are still intact."
    );

    input.focus();
}


// ============================================================
// RESET CONVERSATION
// ============================================================

async function resetConversation() {

    if (!selectedCharacter) {

        alert(
            "Choose a character first."
        );

        return;
    }

    if (
        !confirm(
            "Reset this conversation? Important world memories will remain."
        )
    ) {
        return;
    }

    await fetch(
        "/api/reset-conversation",
        {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/json"
            },
            body: JSON.stringify({
                character:
                    selectedCharacter
            })
        }
    );

    messages.innerHTML = "";

    addMessage(
        "ai",
        "Conversation reset. My important memories of this world remain."
    );
}


// ============================================================
// STORY MODE
// ============================================================

function toggleStory() {

    storyPanel.classList.toggle(
        "visible"
    );

    renderStory();
}


async function loadStory() {

    const response =
        await fetch("/api/story");

    story =
        await response.json();

    storyTree =
        story.tree;

    renderStory();
}


function renderStory() {

    if (!story || !storyTree) {
        return;
    }

    const current =
        story.node_id === "start"
            ? storyTree.start
            : storyTree.nodes[
                story.node_id
            ];

    if (!current) {
        return;
    }

    document.getElementById(
        "storyTitle"
    ).textContent =
        storyTree.title;

    storyContent.innerHTML = "";

    const scene =
        document.createElement("div");

    scene.className =
        "story-scene";

    scene.textContent =
        current.text;

    storyContent.appendChild(scene);

    if (current.ending) {

        const ending =
            document.createElement("div");

        ending.className =
            "ending";

        ending.innerHTML =
            `<strong>ENDING REACHED</strong><br><br>
             ${storyTree.endings[current.ending]}`;

        storyContent.appendChild(
            ending
        );

        return;
    }

    const choices =
        current.choices || [];

    choices.forEach(
        (nodeId, index) => {

            const node =
                storyTree.nodes[nodeId];

            if (!node) {
                return;
            }

            const button =
                document.createElement("button");

            button.className =
                "choice";

            const letter =
                String.fromCharCode(
                    65 + index
                );

            button.innerHTML =
                `<span class="choice-label">
                    ${letter}.
                </span>
                ${node.text}`;

            button.onclick =
                () => chooseStory(index);

            storyContent.appendChild(
                button
            );
        }
    );

    const progress =
        document.createElement("div");

    progress.className =
        "status";

    progress.textContent =
        `Chapter ${story.chapter} • ` +
        `${story.visited_nodes.length} discovered nodes`;

    storyContent.appendChild(
        progress
    );
}


async function chooseStory(choice) {

    const response =
        await fetch(
            "/api/story/choose",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    choice: choice
                })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        alert(
            data.error ||
            "Story choice failed."
        );

        return;
    }

    await loadStory();

    storyPanel.classList.add(
        "visible"
    );
}


// ============================================================
// STORY TREE
// ============================================================

function showTree() {

    if (!storyTree) {
        return;
    }

    const visited =
        new Set(
            story.visited_nodes
        );

    let html = `
        <h2>🌳 Story Tree</h2>
        <p>
            Blue = discovered.
            Gray = not discovered.
            Gold = ending.
        </p>
    `;

    html += renderTreeNode(
        "start",
        storyTree.start,
        visited,
        0
    );

    document.getElementById(
        "modalContent"
    ).innerHTML = html;

    document.getElementById(
        "overlay"
    ).classList.add("visible");
}


function renderTreeNode(
    id,
    node,
    visited,
    depth
) {

    if (!node) {
        return "";
    }

    const seen =
        id === "start" ||
        visited.has(id);

    const ending =
        Boolean(node.ending);

    let html = `
        <div class="tree-node
            ${seen ? "seen" : ""}
            ${ending ? "ending" : ""}"
            style="margin-left:${Math.min(
                depth * 10,
                160
            )}px">

            <div class="tree-label">
                ${id}
            </div>

            <div class="${
                seen
                    ? "tree-seen"
                    : "tree-hidden"
            }">

                ${
                    seen
                        ? escapeHtml(
                            node.text || ""
                          )
                        : "??? Undiscovered path"
                }

            </div>
    `;

    if (ending && seen) {

        html += `
            <div class="tree-label">
                Ending:
                ${escapeHtml(
                    storyTree.endings[
                        node.ending
                    ] || node.ending
                )}
            </div>
        `;

    }

    if (
        seen &&
        node.choices &&
        depth < 4
    ) {

        node.choices.forEach(
            childId => {

                const child =
                    storyTree.nodes[
                        childId
                    ];

                if (child) {

                    html +=
                        renderTreeNode(
                            childId,
                            child,
                            visited,
                            depth + 1
                        );
                }

            }
        );

    }

    html += "</div>";

    return html;
}


// ============================================================
// NPC INTERACTIONS
// ============================================================

async function showInteractions() {

    const response =
        await fetch(
            "/api/npc-interactions"
        );

    const data =
        await response.json();

    let html = `
        <h2>👥 NPC Interactions</h2>
        <p>
            Characters can have their own conversations
            even when you're not talking to them.
        </p>
    `;

    if (!data.interactions.length) {

        html += `
            <p>
                No NPC interactions have happened yet.
            </p>
        `;

    }

    data.interactions.forEach(
        item => {

            html += `
                <div class="interaction">

                    <strong>
                        ${escapeHtml(
                            item.character_a
                        )}
                        ↔
                        ${escapeHtml(
                            item.character_b
                        )}
                    </strong>

                    <div class="status">
                        ${escapeHtml(
                            item.location
                        )}
                    </div>

                    <p>
                        ${escapeHtml(
                            item.content
                        )}
                    </p>

                </div>
            `;
        }
    );

    html += `
        <button
            class="modal-button"
            onclick="createNPCInteraction()">

            Create NPC Interaction

        </button>
    `;

    document.getElementById(
        "modalContent"
    ).innerHTML = html;

    document.getElementById(
        "overlay"
    ).classList.add("visible");
}


async function createNPCInteraction() {

    const response =
        await fetch(
            "/api/npc-interaction",
            {
                method: "POST"
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        alert(
            data.error ||
            "NPC interaction failed."
        );

        return;
    }

    showInteractions();
}


// ============================================================
// SELF IMPROVEMENT
// ============================================================

async function showImprovements() {

    const response =
        await fetch("/api/status");

    const data =
        await response.json();

    const improvements =
        await getImprovements();

    let html = `
        <h2>🧠 Improvement System</h2>

        <p>
            The improvement system studies what happens
            in the world and stores behavioral improvements.
            It does not rewrite your Python code.
        </p>

        <button
            class="modal-button"
            onclick="runImprovement()">

            Analyze World & Improve AI

        </button>

        <div id="improvementList">
    `;

    improvements.forEach(
        item => {

            html += `
                <div class="improvement">
                    ${escapeHtml(item)}
                </div>
            `;

        }
    );

    html += "</div>";

    document.getElementById(
        "modalContent"
    ).innerHTML = html;

    document.getElementById(
        "overlay"
    ).classList.add("visible");
}


async function getImprovements() {

    const response =
        await fetch("/api/status");

    const data =
        await response.json();

    // Improvements are not directly included in status.
    // Use an empty list until the improvement engine runs.
    return [];
}


async function runImprovement() {

    const button =
        event.target;

    button.disabled = true;

    button.textContent =
        "Improving...";

    try {

        const response =
            await fetch(
                "/api/improve",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Improvement failed."
            );
        }

        let html = `
            <h2>🧠 AI Improvements</h2>

            <p>
                New behavioral improvements were created.
            </p>
        `;

        data.improvements.forEach(
            item => {

                html += `
                    <div class="improvement">
                        ${escapeHtml(item)}
                    </div>
                `;

            }
        );

        document.getElementById(
            "modalContent"
        ).innerHTML = html;

    } catch (error) {

        alert(
            error.message
        );

        button.disabled = false;

        button.textContent =
            "Analyze World & Improve AI";
    }
}


// ============================================================
// WORLD CONTROLS
// ============================================================

function renderWorld(world) {

    document.getElementById(
        "worldInfo"
    ).innerHTML = `
        <strong>
            World ${world.world_number}
        </strong>

        <br><br>

        Location:
        ${escapeHtml(
            world.current_location
        )}

        <br>

        Seed:
        ${escapeHtml(
            world.seed
        )}
    `;
}


async function refreshWorld() {

    const response =
        await fetch("/api/status");

    const data =
        await response.json();

    renderWorld(data.world);

    story =
        data.story;

    storyTree =
        story.tree;

    renderStory();
}


async function newWorld() {

    if (
        !confirm(
            "Create a completely new world? Your current world will be saved for replay."
        )
    ) {
        return;
    }

    const response =
        await fetch(
            "/api/world/new",
            {
                method: "POST"
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        alert(
            data.error ||
            "Could not create world."
        );

        return;
    }

    renderWorld(data.world);

    story =
        data.story;

    storyTree =
        story.tree;

    messages.innerHTML = "";

    addMessage(
        "ai",
        "A new world has begun."
    );

    renderStory();
}


async function resetWorld() {

    if (
        !confirm(
            "RESET THIS WORLD? This clears conversations, memories, NPC interactions, events, and story progress."
        )
    ) {
        return;
    }

    const response =
        await fetch(
            "/api/world/reset",
            {
                method: "POST"
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        alert(
            data.error ||
            "Could not reset world."
        );

        return;
    }

    renderWorld(data.world);

    story =
        data.story;

    storyTree =
        story.tree;

    messages.innerHTML = "";

    addMessage(
        "ai",
        "The world has been reset. Everyone's world-specific memories and story progress are gone."
    );

    renderStory();
}


async function showPreviousWorlds() {

    const response =
        await fetch("/api/worlds");

    const data =
        await response.json();

    let html = `
        <h2>📚 Replay Worlds</h2>

        <p>
            Previous worlds are saved here so you can replay them.
        </p>
    `;

    if (!data.worlds.length) {

        html += `
            <p>
                No previous worlds yet.
            </p>
        `;

    }

    data.worlds.forEach(
        world => {

            html += `
                <div class="interaction">

                    <strong>
                        World ${world.world_number}
                    </strong>

                    <div class="status">
                        Seed: ${escapeHtml(
                            world.seed
                        )}
                    </div>

                    <button
                        class="modal-button"
                        onclick="replayWorld(
                            ${world.id}
                        )">

                        Replay This World

                    </button>

                </div>
            `;
        }
    );

    document.getElementById(
        "modalContent"
    ).innerHTML = html;

    document.getElementById(
        "overlay"
    ).classList.add("visible");
}


async function replayWorld(id) {

    const response =
        await fetch(
            "/api/world/replay",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    world_id: id
                })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        alert(
            data.error ||
            "Replay failed."
        );

        return;
    }

    closeModal();

    renderWorld(data.world);

    story =
        data.story;

    storyTree =
        story.tree;

    messages.innerHTML = "";

    addMessage(
        "ai",
        "Previous world restored."
    );

    renderStory();
}


// ============================================================
// MODAL
// ============================================================

function closeModal(event) {

    if (
        !event ||
        event.target ===
        document.getElementById(
            "overlay"
        )
    ) {

        document.getElementById(
            "overlay"
        ).classList.remove(
            "visible"
        );
    }
}


// ============================================================
// IDLE NPC ACTIVITY
// ============================================================

function restartIdleTimer() {

    clearTimeout(idleTimer);

    idleTimer =
        setTimeout(
            async () => {

                try {

                    await fetch(
                        "/api/npc-interaction",
                        {
                            method: "POST"
                        }
                    );

                } catch (error) {

                    console.log(
                        "NPC activity skipped."
                    );

                }

                restartIdleTimer();

            },
            60000
        );
}


// ============================================================
// LOCATION HELPER
// ============================================================

async function travelTo(location) {

    const response =
        await fetch(
            "/world/advance",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    location:
                        location
                })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        alert(
            data.error ||
            "Travel failed."
        );

        return;
    }

    await refreshWorld();
}


// ============================================================
// HTML ESCAPING
// ============================================================

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}


// ============================================================
// START
// ============================================================

initialize();

restartIdleTimer();

</script>

</body>
</html>
