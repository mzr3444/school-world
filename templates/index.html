<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School World</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10131a;
    color: white;
    height: 100vh;
    overflow: hidden;
}

button {
    border: none;
    border-radius: 10px;
    padding: 11px 15px;
    cursor: pointer;
    background: #242b38;
    color: white;
    transition: 0.15s;
}

button:hover {
    background: #343e4e;
}

.app {
    height: 100vh;
    display: flex;
}

/* =========================================================
SIDEBAR
========================================================= */

.sidebar {
    width: 260px;
    background: #171b24;
    border-right: 1px solid #303744;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
}

.world-box {
    background: #202631;
    padding: 13px;
    border-radius: 12px;
}

.world-box div {
    margin: 6px 0;
    color: #b9c2d0;
}

.menu-title {
    color: #7f8a9d;
    font-size: 12px;
    text-transform: uppercase;
    margin-top: 10px;
}

.menu-button {
    width: 100%;
    text-align: left;
    background: transparent;
    padding: 12px;
}

.menu-button:hover {
    background: #252d3a;
}

.story-button {
    background: #47327c;
}

.story-button:hover {
    background: #5a4099;
}

.reset-world {
    margin-top: auto;
    background: #542b35;
}

.reset-world:hover {
    background: #713641;
}


/* =========================================================
MAIN CHAT
========================================================= */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 64px;
    border-bottom: 1px solid #303744;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #151922;
}

.location {
    color: #aeb8c8;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    max-width: 760px;
    margin-bottom: 20px;
    padding: 15px;
    border-radius: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
}

.message.user {
    margin-left: auto;
    background: #344c70;
}

.message.ai {
    background: #202631;
}

.message-name {
    font-weight: bold;
    margin-bottom: 7px;
}

.composer {
    padding: 15px;
    border-top: 1px solid #303744;
    background: #151922;
    display: flex;
    gap: 10px;
}

.composer textarea {
    flex: 1;
    resize: none;
    height: 55px;
    border: 1px solid #3b4452;
    background: #202631;
    color: white;
    border-radius: 12px;
    padding: 14px;
    outline: none;
}

.send {
    background: #496fa8;
}


/* =========================================================
CHARACTER PANEL
========================================================= */

.characters {
    width: 270px;
    background: #171b24;
    border-left: 1px solid #303744;
    padding: 15px;
    overflow-y: auto;
}

.character-card {
    background: #202631;
    padding: 13px;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
}

.character-card:hover {
    background: #2a3341;
}

.character-card.active {
    border: 1px solid #668ac2;
}

.character-name {
    font-weight: bold;
}

.character-role {
    font-size: 12px;
    color: #9ba6b6;
    margin-top: 3px;
}

.character-personality {
    font-size: 12px;
    color: #b7c0ce;
    margin-top: 7px;
}


/* =========================================================
TRAVEL
========================================================= */

.travel {
    padding: 10px;
    border-top: 1px solid #303744;
}

.travel select {
    width: 100%;
    background: #202631;
    color: white;
    border: 1px solid #3b4452;
    border-radius: 9px;
    padding: 9px;
}


/* =========================================================
STORY FULL SCREEN
========================================================= */

.story-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #080a0f;
    z-index: 1000;
}

.story-overlay.open {
    display: flex;
}

.story-main {
    flex: 1;
    overflow-y: auto;
    padding: 35px;
}

.story-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.story-title {
    font-size: 34px;
    font-weight: bold;
}

.story-theme {
    color: #9da9bb;
    margin-top: 7px;
}

.story-scene {
    max-width: 900px;
    margin: 0 auto;
}

.scene-title {
    font-size: 28px;
    margin-bottom: 15px;
}

.scene-text {
    font-size: 18px;
    line-height: 1.7;
    color: #d8deea;
    margin-bottom: 30px;
}

.choice {
    display: block;
    width: 100%;
    text-align: left;
    margin: 12px 0;
    padding: 18px;
    font-size: 16px;
    background: #1b2230;
    border: 1px solid #303b4d;
}

.choice:hover {
    background: #29364a;
}

.choice-letter {
    font-weight: bold;
    color: #8daff0;
    margin-right: 10px;
}

.story-side {
    width: 330px;
    border-left: 1px solid #303744;
    background: #11151d;
    padding: 20px;
    overflow-y: auto;
}

.tree-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

.tree-node {
    padding: 10px;
    margin-bottom: 7px;
    border-radius: 8px;
    background: #1c222c;
    color: #777f8d;
    font-size: 13px;
}

.tree-node.seen {
    color: white;
    background: #26364b;
}

.tree-node.current {
    border: 1px solid #6b91c9;
}

.tree-node.ending {
    background: #34284d;
}

.tree-node.hidden {
    opacity: 0.35;
}

.story-controls {
    display: flex;
    gap: 8px;
}

.exit-story {
    background: #542b35;
}

.replay {
    background: #344f3b;
}

.ending-box {
    background: #30233f;
    border: 1px solid #72579a;
    border-radius: 15px;
    padding: 25px;
    margin-top: 25px;
}

.hidden {
    display: none !important;
}


/* =========================================================
MODAL
========================================================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 2000;
    align-items: center;
    justify-content: center;
}

.modal.open {
    display: flex;
}

.modal-box {
    width: min(600px, 90%);
    background: #1a202b;
    padding: 25px;
    border-radius: 15px;
}

.modal-box input,
.modal-box textarea {
    width: 100%;
    margin: 8px 0 15px;
    padding: 12px;
    background: #11151d;
    border: 1px solid #3c4655;
    color: white;
    border-radius: 8px;
}

.modal-box textarea {
    min-height: 100px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
    SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <div class="logo">
            🌎 School World
        </div>

        <div class="world-box">
            <div>World: <strong id="worldNumber">1</strong></div>
            <div>World ID: <strong id="worldId">---</strong></div>
            <div>Location: <strong id="currentLocation">Classroom</strong></div>
        </div>

        <div class="menu-title">Menu</div>

        <button class="menu-button story-button"
                onclick="openStoryMode()">
            🌌 Story Mode
        </button>

        <button class="menu-button"
                onclick="openCreateCharacter()">
            👤 Create Character
        </button>

        <button class="menu-button"
                onclick="advanceWorld()">
            🔄 Advance World
        </button>

        <button class="menu-button"
                onclick="showBackgroundEvents()">
            📰 World Events
        </button>

        <div class="menu-title">Travel</div>

        <div class="travel">
            <select id="travelSelect"
                    onchange="travel(this.value)">
            </select>
        </div>

        <button class="reset-world"
                onclick="resetWorld()">
            🌌 Reset World
        </button>

    </aside>


    <!-- =====================================================
    CHAT
    ====================================================== -->

    <main class="main">

        <div class="topbar">

            <div>
                <strong id="selectedCharacterName">
                    Select a character
                </strong>

                <div class="location"
                     id="selectedCharacterRole">
                </div>
            </div>

            <div>
                <button onclick="newConversation()">
                    New Text
                </button>

                <button onclick="resetConversation()">
                    Reset Convo
                </button>
            </div>

        </div>


        <section class="chat" id="chat"></section>


        <div class="composer">

            <textarea
                id="messageInput"
                placeholder="Talk to the character..."
                onkeydown="handleEnter(event)"
            ></textarea>

            <button class="send"
                    onclick="sendMessage()">
                Send
            </button>

        </div>

    </main>


    <!-- =====================================================
    CHARACTERS
    ====================================================== -->

    <aside class="characters">

        <div class="menu-title">
            Characters
        </div>

        <div id="characterList"></div>

    </aside>

</div>


<!-- =========================================================
STORY MODE
========================================================== -->

<div class="story-overlay"
     id="storyOverlay">

    <section class="story-main">

        <div class="story-header">

            <div>
                <div class="story-title"
                     id="storyTitle">
                    Story Mode
                </div>

                <div class="story-theme"
                     id="storyTheme">
                </div>
            </div>

            <div class="story-controls">

                <button class="replay"
                        onclick="replayStory()">
                    🔁 Replay
                </button>

                <button class="exit-story"
                        onclick="closeStoryMode()">
                    ✕ Exit
                </button>

            </div>

        </div>


        <div class="story-scene">

            <div class="scene-title"
                 id="sceneTitle">
            </div>

            <div class="scene-text"
                 id="sceneText">
            </div>

            <div id="choices"></div>

            <div id="endingBox"
                 class="ending-box hidden">
            </div>

        </div>

    </section>


    <aside class="story-side">

        <div class="tree-title">
            🌳 Story Tree
        </div>

        <div id="storyTree"></div>

    </aside>

</div>


<!-- =========================================================
CHARACTER MODAL
========================================================== -->

<div class="modal"
     id="characterModal">

    <div class="modal-box">

        <h2>Create Character</h2>

        <input id="newName"
               placeholder="Name">

        <input id="newRole"
               placeholder="Role">

        <textarea id="newPersonality"
                  placeholder="Personality"></textarea>

        <textarea id="newDescription"
                  placeholder="Description"></textarea>

        <input id="newTraits"
               placeholder="Traits separated by commas">

        <div class="modal-actions">

            <button onclick="closeCreateCharacter()">
                Cancel
            </button>

            <button onclick="createCharacter()">
                Create
            </button>

        </div>

    </div>

</div>


<script>

let world = null;
let selectedCharacter = null;
let story = null;


/* =========================================================
LOAD WORLD
========================================================= */

async function loadWorld() {

    const response = await fetch("/world");

    world = await response.json();

    updateWorldUI();
}


/* =========================================================
UPDATE UI
========================================================= */

function updateWorldUI() {

    document.getElementById("worldNumber").textContent =
        world.world_number;

    document.getElementById("worldId").textContent =
        world.world_id;

    document.getElementById("currentLocation").textContent =
        world.location;

    const travelSelect =
        document.getElementById("travelSelect");

    travelSelect.innerHTML = "";

    world.locations.forEach(location => {

        const option = document.createElement("option");

        option.value = location;
        option.textContent = location;

        if (location === world.location) {
            option.selected = true;
        }

        travelSelect.appendChild(option);

    });


    renderCharacters();

    if (world.story && world.story.tree) {
        story = world.story;
    }
}


/* =========================================================
CHARACTERS
========================================================= */

function renderCharacters() {

    const container =
        document.getElementById("characterList");

    container.innerHTML = "";

    world.characters.forEach(character => {

        const card =
            document.createElement("div");

        card.className =
            "character-card" +
            (selectedCharacter &&
             selectedCharacter.id === character.id
                ? " active"
                : "");

        card.innerHTML = `
            <div class="character-name">
                ${escapeHtml(character.name)}
            </div>

            <div class="character-role">
                ${escapeHtml(character.role)}
            </div>

            <div class="character-personality">
                ${escapeHtml(character.personality)}
            </div>
        `;

        card.onclick = () =>
            selectCharacter(character.id);

        container.appendChild(card);
    });
}


/* =========================================================
SELECT CHARACTER
========================================================= */

function selectCharacter(id) {

    const character =
        world.characters.find(c => c.id === id);

    if (!character) return;

    selectedCharacter = character;

    document.getElementById(
        "selectedCharacterName"
    ).textContent = character.name;

    document.getElementById(
        "selectedCharacterRole"
    ).textContent =
        `${character.role} • ${character.personality}`;

    renderCharacters();

    renderConversation();
}


/* =========================================================
CONVERSATION
========================================================= */

function renderConversation() {

    const chat =
        document.getElementById("chat");

    chat.innerHTML = "";

    if (!selectedCharacter) {

        chat.innerHTML = `
            <div class="message ai">
                <div class="message-name">
                    School World
                </div>

                Choose a character on the right to begin a conversation.
            </div>
        `;

        return;
    }

    const conversation =
        selectedCharacter.conversation || [];

    conversation.forEach(item => {

        const message =
            document.createElement("div");

        message.className =
            "message " +
            (item.role === "user"
                ? "user"
                : "ai");

        const name =
            item.role === "user"
                ? "You"
                : selectedCharacter.name;

        message.innerHTML = `
            <div class="message-name">
                ${escapeHtml(name)}
            </div>

            ${escapeHtml(item.content)}
        `;

        chat.appendChild(message);
    });

    chat.scrollTop = chat.scrollHeight;
}


/* =========================================================
SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (!selectedCharacter) {

        alert("Choose a character first.");

        return;
    }

    const input =
        document.getElementById("messageInput");

    const message =
        input.value.trim();

    if (!message) return;

    input.value = "";

    addTemporaryMessage("You", message, "user");

    try {

        const response =
            await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    character_id:
                        selectedCharacter.id,
                    message: message
                })
            });

        const result =
            await response.json();

        if (!response.ok) {

            addTemporaryMessage(
                "Error",
                result.error || "AI request failed.",
                "ai"
            );

            return;
        }

        selectedCharacter =
            result.character;

        const index =
            world.characters.findIndex(
                c => c.id === selectedCharacter.id
            );

        if (index !== -1) {
            world.characters[index] =
                selectedCharacter;
        }

        renderConversation();

    } catch (error) {

        addTemporaryMessage(
            "Error",
            error.toString(),
            "ai"
        );
    }
}


function addTemporaryMessage(name, text, type) {

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.innerHTML = `
        <div class="message-name">
            ${escapeHtml(name)}
        </div>

        ${escapeHtml(text)}
    `;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}


function handleEnter(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();
    }
}


/* =========================================================
NEW TEXT
========================================================= */

function newConversation() {

    document.getElementById(
        "messageInput"
    ).value = "";

    document.getElementById(
        "messageInput"
    ).focus();
}


/* =========================================================
RESET CONVERSATION
========================================================= */

async function resetConversation() {

    if (!selectedCharacter) {

        alert("Choose a character first.");

        return;
    }

    if (!confirm(
        `Reset your conversation with ${selectedCharacter.name}?`
    )) {
        return;
    }

    await fetch("/conversation/reset", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            character_id:
                selectedCharacter.id
        })
    });

    selectedCharacter.conversation = [];

    renderConversation();
}


/* =========================================================
TRAVEL
========================================================= */

async function travel(location) {

    const response =
        await fetch("/world/travel", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                location: location
            })
        });

    const result =
        await response.json();

    if (result.success) {

        world.location =
            result.location;

        document.getElementById(
            "currentLocation"
        ).textContent =
            result.location;
    }
}


/* =========================================================
BACKGROUND WORLD
========================================================= */

async function advanceWorld() {

    const response =
        await fetch("/world/advance", {
            method: "POST"
        });

    const result =
        await response.json();

    if (result.event) {

        alert(
            `${result.event.characters.join(" & ")}\n\n` +
            `${result.event.event}`
        );
    }
}


function showBackgroundEvents() {

    if (!world.background_events ||
        world.background_events.length === 0) {

        alert("No background events yet.");

        return;
    }

    const recent =
        world.background_events
            .slice(-8)
            .map(e =>
                `${e.characters.join(" & ")} — ${e.location}\n${e.event}`
            )
            .join("\n\n");

    alert(recent);
}


/* =========================================================
WORLD RESET
========================================================= */

async function resetWorld() {

    if (!confirm(
        "Create a completely new world?\n\n" +
        "This clears character memories, conversations, " +
        "world events, and the current story."
    )) {
        return;
    }

    const response =
        await fetch("/world/reset", {
            method: "POST"
        });

    const result =
        await response.json();

    if (result.success) {

        selectedCharacter = null;

        await loadWorld();

        document.getElementById(
            "chat"
        ).innerHTML = `
            <div class="message ai">
                <div class="message-name">
                    New Universe
                </div>

                World #${result.world_number} created.
                All memories and story progression were reset.
            </div>
        `;
    }
}


/* =========================================================
STORY MODE
========================================================= */

async function openStoryMode() {

    document.getElementById(
        "storyOverlay"
    ).classList.add("open");

    try {

        const response =
            await fetch("/story/tree");

        const result =
            await response.json();

        if (!result.tree ||
            !result.tree.nodes ||
            Object.keys(result.tree.nodes).length === 0) {

            await startNewStory();

        } else {

            story = {
                active: result.active,
                title: result.title,
                theme: result.theme,
                tree: result.tree,
                seen_nodes: result.seen_nodes,
                history: result.history,
                ending: result.ending,
                current_node:
                    result.history.length > 0
                        ? result.history[result.history.length - 1].next
                        : result.tree.start
            };

            renderStory();
        }

    } catch (error) {

        console.error(error);

        await startNewStory();
    }
}


function closeStoryMode() {

    document.getElementById(
        "storyOverlay"
    ).classList.remove("open");
}


async function startNewStory() {

    const response =
        await fetch("/story/start", {
            method: "POST"
        });

    const result =
        await response.json();

    if (!response.ok) {

        alert(
            result.error ||
            "Could not create story."
        );

        return;
    }

    story = result.story;

    renderStory();
}


/* =========================================================
STORY RENDER
========================================================= */

function renderStory() {

    if (!story) return;

    document.getElementById(
        "storyTitle"
    ).textContent =
        story.title || "Story Mode";

    document.getElementById(
        "storyTheme"
    ).textContent =
        story.theme || "";

    const nodes =
        story.tree.nodes || {};

    const current =
        nodes[story.current_node];

    if (!current) {

        return;
    }

    document.getElementById(
        "sceneTitle"
    ).textContent =
        current.title;

    document.getElementById(
        "sceneText"
    ).textContent =
        current.text;

    const choices =
        document.getElementById("choices");

    choices.innerHTML = "";

    const endingBox =
        document.getElementById("endingBox");

    endingBox.classList.add("hidden");

    if (current.ending) {

        endingBox.classList.remove("hidden");

        endingBox.innerHTML = `
            <h2>${escapeHtml(current.title)}</h2>

            <p>
                ${escapeHtml(current.text)}
            </p>

            <button onclick="replayStory()">
                🔁 Replay This World
            </button>
        `;

    } else {

        current.choices.forEach(choice => {

            const button =
                document.createElement("button");

            button.className = "choice";

            button.innerHTML = `
                <span class="choice-letter">
                    ${choice.id}.
                </span>

                ${escapeHtml(choice.text)}
            `;

            button.onclick = () =>
                chooseStory(choice.id);

            choices.appendChild(button);
        });
    }

    renderStoryTree();
}


/* =========================================================
STORY CHOICE
========================================================= */

async function chooseStory(choice) {

    const response =
        await fetch("/story/choose", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                choice: choice
            })
        });

    const result =
        await response.json();

    if (!response.ok) {

        alert(
            result.error ||
            "Choice failed."
        );

        return;
    }

    story = result.story;

    renderStory();
}


/* =========================================================
STORY TREE DISPLAY
========================================================= */

function renderStoryTree() {

    const container =
        document.getElementById("storyTree");

    container.innerHTML = "";

    if (!story || !story.tree) return;

    const nodes =
        story.tree.nodes || {};

    const seen =
        story.seen_nodes || [];

    Object.entries(nodes).forEach(
        ([id, node]) => {

            const div =
                document.createElement("div");

            let classes = "tree-node";

            if (seen.includes(id)) {
                classes += " seen";
            } else {
                classes += " hidden";
            }

            if (id === story.current_node) {
                classes += " current";
            }

            if (node.ending) {
                classes += " ending";
            }

            div.className = classes;

            let label = "";

            if (id === story.current_node) {
                label = "▶ ";
            }

            if (seen.includes(id)) {
                label += node.title;
            } else {
                label += "???";
            }

            div.textContent = label;

            container.appendChild(div);
        }
    );
}


/* =========================================================
REPLAY
========================================================= */

async function replayStory() {

    const response =
        await fetch("/story/replay", {
            method: "POST"
        });

    const result =
        await response.json();

    if (!response.ok) {

        alert(
            result.error ||
            "Unable to replay story."
        );

        return;
    }

    story = result.story;

    renderStory();
}


/* =========================================================
CREATE CHARACTER
========================================================= */

function openCreateCharacter() {

    document.getElementById(
        "characterModal"
    ).classList.add("open");
}


function closeCreateCharacter() {

    document.getElementById(
        "characterModal"
    ).classList.remove("open");
}


async function createCharacter() {

    const name =
        document.getElementById(
            "newName"
        ).value.trim();

    const role =
        document.getElementById(
            "newRole"
        ).value.trim();

    const personality =
        document.getElementById(
            "newPersonality"
        ).value.trim();

    const description =
        document.getElementById(
            "newDescription"
        ).value.trim();

    const traits =
        document.getElementById(
            "newTraits"
        ).value
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);

    if (!name || !personality) {

        alert(
            "Name and personality are required."
        );

        return;
    }

    const response =
        await fetch("/characters/create", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name,
                role,
                personality,
                description,
                traits
            })
        });

    const result =
        await response.json();

    if (!response.ok) {

        alert(
            result.error ||
            "Character creation failed."
        );

        return;
    }

    world.characters.push(
        result.character
    );

    closeCreateCharacter();

    renderCharacters();

    selectCharacter(
        result.character.id
    );
}


/* =========================================================
HTML SAFETY
========================================================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

loadWorld();
